name: Apply syscc source overrides
description: Replace only the selected source files with versions from main

inputs:
  custom-repository:
    description: Repository containing the custom source files
    required: true
  custom-ref:
    description: Branch, tag, or commit containing the custom source files
    required: true

outputs:
  custom-sha:
    description: Commit containing the applied source overrides
    value: ${{ steps.save-custom-source.outputs.commit }}

runs:
  using: composite
  steps:
    - name: Checkout custom source files
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        repository: ${{ inputs.custom-repository }}
        ref: ${{ inputs.custom-ref }}
        path: .syscc-custom-source
        fetch-depth: 1
        sparse-checkout: |
          /libs/hbb_common/
          /src/common.rs
        sparse-checkout-cone-mode: false

    - name: Apply custom source files
      id: save-custom-source
      shell: bash
      run: |
        set -euo pipefail

        custom_source_dir=".syscc-custom-source"
        test -f "${custom_source_dir}/libs/hbb_common/Cargo.toml"
        test -f "${custom_source_dir}/libs/hbb_common/src/lib.rs"
        test -f "${custom_source_dir}/src/common.rs"

        override_dir="$RUNNER_TEMP/syscc-overrides"
        rm -rf "$override_dir"
        mkdir -p "$override_dir/libs"
        cp -R "${custom_source_dir}/libs/hbb_common" "$override_dir/libs/hbb_common"
        cp "${custom_source_dir}/src/common.rs" "$override_dir/common.rs"

        custom_sha="$(git -C "$custom_source_dir" rev-parse HEAD)"
        echo "commit=${custom_sha}" >> "$GITHUB_OUTPUT"

        rm -rf "$custom_source_dir"
        rm -rf libs/hbb_common
        cp -R "$override_dir/libs/hbb_common" libs/hbb_common
        cp "$override_dir/common.rs" src/common.rs

        echo "Applied only libs/hbb_common and src/common.rs from ${custom_sha}"

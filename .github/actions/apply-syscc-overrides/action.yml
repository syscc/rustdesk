name: Apply syscc source changes
description: Apply only syscc custom changes to the checked-out upstream source

inputs:
  enabled:
    description: Apply syscc patches to the checked-out source
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Apply syscc source patches
      if: inputs.enabled == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        test -d libs/hbb_common
        test -f src/common.rs
        test -f "${ACTION_PATH}/apply.py"

        if command -v python3 >/dev/null 2>&1; then
          python3 "${ACTION_PATH}/apply.py"
        else
          python "${ACTION_PATH}/apply.py"
        fi

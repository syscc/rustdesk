name: Flutter Tag Build
run-name: Flutter ${{ inputs.source-ref || github.ref_name }} → ${{ inputs.upload-tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Branch, tag, or commit to build from rustdesk/rustdesk
        required: true
        default: refs/heads/master
        type: string
      upload-artifact:
        description: Build packages and upload workflow artifacts
        required: true
        default: true
        type: boolean
      publish-release:
        description: Publish packages to Releases (disable for a full packaging test)
        required: true
        default: true
        type: boolean
      upload-tag:
        description: Release tag used when artifacts are published
        required: true
        default: nightly
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

# Runs publishing the same release must not delete/replace each other's assets.
concurrency:
  group: flutter-release-${{ github.event_name == 'push' && github.ref_name || inputs.upload-tag || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      source-repository: rustdesk/rustdesk
      source-ref: ${{ github.event_name == 'push' && github.ref || inputs.source-ref }}
      apply-syscc-patches: true
      upload-artifact: ${{ github.event_name == 'push' || inputs.upload-artifact }}
      upload-tag: ${{ github.event_name == 'push' && github.ref_name || inputs.upload-tag || 'nightly' }}
      publish-release: ${{ github.event_name == 'push' || inputs.publish-release }}

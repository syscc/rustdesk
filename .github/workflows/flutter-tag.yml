name: Flutter Tag Build
run-name: Flutter ${{ github.event_name == 'push' && github.ref_name || inputs.source-ref || 'latest stable release' }} → ${{ github.event_name == 'push' && github.ref_name || inputs.upload-tag || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Branch, tag, or commit to build from rustdesk/rustdesk (blank uses the latest stable tag)
        required: false
        type: string
      upload-artifact:
        description: Build packages and upload workflow artifacts
        required: true
        default: true
        type: boolean
      publish-release:
        description: Publish packages to Releases (disable for a full packaging test)
        required: true
        default: true
        type: boolean
      upload-tag:
        description: Release tag used when artifacts are published (blank uses the resolved source tag)
        required: false
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

# Runs publishing the same release must not delete/replace each other's assets.
concurrency:
  group: flutter-release-${{ github.event_name == 'push' && github.ref_name || inputs.upload-tag || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-latest-tag:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.source-ref == ''
    permissions:
      contents: read
    outputs:
      source-ref: ${{ steps.resolve.outputs.source-ref }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve latest stable tag from upstream
        id: resolve
        env:
          SOURCE_REPOSITORY: rustdesk/rustdesk
        run: |
          TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SOURCE_REPOSITORY/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::No stable release found in $SOURCE_REPOSITORY"
            exit 1
          fi
          echo "source-ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  run-flutter-tag-build:
    needs: [resolve-latest-tag]
    # A skipped resolution is expected on tag pushes and when source-ref is set;
    # never let a skipped dependency collapse the build, and never start it
    # after cancellation.
    if: ${{ !cancelled() && (needs.resolve-latest-tag.result == 'success' || needs.resolve-latest-tag.result == 'skipped') }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      source-repository: rustdesk/rustdesk
      source-ref: ${{ github.event_name == 'push' && github.ref || inputs.source-ref || needs.resolve-latest-tag.outputs.source-ref }}
      apply-syscc-patches: true
      pre-elevate-service: ${{ vars.PRE_ELEVATE_SERVICE == 'true' }}
      upload-artifact: ${{ github.event_name == 'push' || inputs.upload-artifact }}
      upload-tag: ${{ github.event_name == 'push' && github.ref_name || inputs.upload-tag || needs.resolve-latest-tag.outputs.tag || 'nightly' }}
      publish-release: ${{ github.event_name == 'push' || inputs.publish-release }}
